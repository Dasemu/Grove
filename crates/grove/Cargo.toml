[package]
name = "grove"
description = "grove command line client"
edition.workspace = true
version.workspace = true

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
grove-core = { version = "0.1.0", path = "../grove-core" }
