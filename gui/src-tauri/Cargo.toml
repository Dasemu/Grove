# Tauri shell for the grove GUI. Deliberately NOT a member of the root workspace: it needs the
# webkit2gtk/libsoup system packages (see docs/phase3.md) and must not break `cargo test` without them.
[package]
name = "grove-gui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "grove desktop GUI (Tauri shell around gui/ui)"

[workspace]

[dependencies]
grove-bridge = { path = "../../crates/grove-bridge" }
grove-daemon = { path = "../../crates/grove-daemon" }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = "2"
